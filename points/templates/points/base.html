<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Puntos geográficos{% endblock %}</title>
</head>
<body>
    <header>
        <a href="{% url 'points:list' %}">Puntos geográficos</a>
        <a href="{% url 'points:create' %}">Nuevo punto</a>
    </header>

    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
