{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{% static 'points/img/favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'points/css/styles.css' %}">
    <title>{% block title %}Puntos geográficos{% endblock %}</title>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="site-header__content">
            <a class="brand-link" href="{% url 'points:list' %}">Puntos geográficos</a>
            <nav aria-label="Navegación principal">
                <a
                    class="github-link"
                    href="https://github.com/AgustinConde/desafio-CRUX"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Ver repositorio en GitHub"
                    title="Ver repositorio en GitHub"
                >
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.6-4-1.6-.5-1.4-1.3-1.8-1.3-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C15.3 5.2 16.3 5.5 16.3 5.5c.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.3.8 1 .8 2v3c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"/>
                    </svg>
                </a>
            </nav>
        </div>
    </header>

    <div class="page-scroll">
        {% if messages %}
            <ul class="message-list">
                {% for message in messages %}
                    <li>
                        <span>{{ message }}</span>
                        <button class="message-close" type="button" aria-label="Cerrar mensaje">
                            &times;
                        </button>
                    </li>
                {% endfor %}
            </ul>
        {% endif %}

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block extra_scripts %}{% endblock %}
    <script src="{% static 'points/js/notifications.js' %}"></script>
</body>
</html>
