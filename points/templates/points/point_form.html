{% extends "points/base.html" %}

{% block title %}{{ view.object|yesno:"Editar punto,Nuevo punto" }}{% endblock %}

{% block content %}
    <h1>{{ view.object|yesno:"Editar punto,Nuevo punto" }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
        <a href="{% url 'points:list' %}">Cancelar</a>
    </form>
{% endblock %}
